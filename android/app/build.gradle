plugins {
    id 'com.android.application'
}

// KenteXa ships as the update of the old "Bishoo Tanzania" Play Store app (com.app.bishoo,
// owner 2026-11-10): same app, same users. Its last version code was 88, so KenteXa counts
// from 100 plus the CI run number; every upload must be higher than the one before.
def ciVersionCode = 100 + ((System.getenv('VERSION_CODE') ?: '0') as int)

android {
    namespace 'com.kentexa.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.app.bishoo'
        minSdk 24 // Play's automatic protection needs 24+ (the old Bishoo app was 24+ too)
        targetSdk 35
        versionCode ciVersionCode
        versionName "2.0.${ciVersionCode}"
    }

    buildTypes {
        release {
            // Signed after the build with the KenteXa upload key (kept off this public repo).
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // One Kotlin version (the old jdk7/jdk8 parts are folded into kotlin-stdlib since 1.8).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
