plugins {
    id 'com.android.application'
}

// KenteXa ships as the update of the old "Bishoo Tanzania" Play Store app (com.app.bishoo,
// owner 2026-11-10): same app, same users. Its last version code was 88, so KenteXa counts
// from 100 plus the CI run number; every upload must be higher than the one before.
def ciVersionCode = 100 + ((System.getenv('VERSION_CODE') ?: '0') as int)

// The office app (KenteXa Ofisi, owner 2026-11-26) is the same wrapper built with -Poffice=true:
// its own package, its own title, and it opens the office dashboard after sign-in. Without the
// flag the build is the main KenteXa app, exactly as before.
def officeBuild = project.hasProperty('office') && project.property('office').toString() == 'true'

android {
    namespace 'com.kentexa.app'
    compileSdk 36

    defaultConfig {
        applicationId officeBuild ? 'com.kentexa.ofisi' : 'com.app.bishoo'
        minSdk 24 // Play's automatic protection needs 24+ (the old Bishoo app was 24+ too)
        targetSdk 36
        versionCode ciVersionCode
        versionName "2.0.${ciVersionCode}"
        // Each value a store build needs to differ on. The file-sharing authority must be unique on
        // a phone, or the two apps cannot be installed together.
        manifestPlaceholders = officeBuild ? [
            appLabel: 'KenteXa Ofisi',
            startUrl: 'https://kentexa.com/p/PublicLogin?next=SuperAgentDashboard&source=ofisi',
            linkHost: 'ofisi.invalid', // the office app does not take over kentexa.com links
            fileProviderAuthority: 'com.kentexa.ofisi.fileprovider',
            appIcon: '@mipmap/ic_launcher_ofisi',
            appRoundIcon: '@mipmap/ic_launcher_ofisi_round',
        ] : [
            appLabel: 'KenteXa',
            startUrl: 'https://kentexa.com/?source=android',
            linkHost: 'kentexa.com',
            fileProviderAuthority: 'com.kentexa.app.fileprovider',
            appIcon: '@mipmap/ic_launcher',
            appRoundIcon: '@mipmap/ic_launcher_round',
        ]
    }

    buildTypes {
        release {
            // Signed after the build with the KenteXa upload key (kept off this public repo).
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // One Kotlin version (the old jdk7/jdk8 parts are folded into kotlin-stdlib since 1.8).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
