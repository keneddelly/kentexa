# KenteXa native app (#422). Checks the code and builds a test APK ("KenteXa Test",
# com.kentexa.app.test) that installs next to the Play Store app. Signed with the Android debug key;
# the Play Store upload key never enters this public repository.
name: Mobile app

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-app.yml'
  push:
    branches: [worktree-service-provider-profiles]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-app.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which app to build'
        type: choice
        options: [test, ofisi]
        default: test
      publish:
        description: 'Publish the APK to its download page (manual runs)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    name: Test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VARIANT: ${{ inputs.variant || 'test' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          # Keep every Expo library on the version made for this Expo SDK.
          npx expo install --fix
      - name: Type check
        run: npx tsc --noEmit
      - name: Expo check
        run: npx expo-doctor || true
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Keep the APK and lock file
        uses: actions/upload-artifact@v4
        with:
          name: kentexa-test-apk
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/package.json
            mobile/package-lock.json
          retention-days: 14
      # One fixed download page per app: the newest APK, opened on the phone.
      - name: Publish APK
        if: (github.event_name != 'workflow_dispatch' || inputs.publish) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$APP_VARIANT" = "ofisi" ]; then
            TAG=app-ofisi; FILE=kentexa-ofisi.apk; TITLE="KenteXa Ofisi APK"
            NOTE="KenteXa Ofisi (app ya ofisi, majaribio). Build ${VERSION_CODE}, commit ${GITHUB_SHA::7}."
          else
            TAG=app-test; FILE=kentexa-test.apk; TITLE="KenteXa Test APK"
            NOTE="KenteXa Test (app ya majaribio). Build ${VERSION_CODE}, commit ${GITHUB_SHA::7}. Inajiweka pembeni ya app ya Play Store."
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --notes "$NOTE"
          else
            gh release create "$TAG" "$FILE" --prerelease --title "$TITLE" --notes "$NOTE" --target "$GITHUB_SHA"
          fi

