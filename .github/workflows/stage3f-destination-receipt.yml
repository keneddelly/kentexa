name: Stage 3F Destination Receipt PostgreSQL Gate

on:
  pull_request:
    branches:
      - worktree-service-provider-profiles
    paths:
      - 'src/super-agents/**'
      - 'src/agent-orders/**'
      - 'src/transport/**'
      - 'src/money-routing/**'
      - 'src/orders/**'
      - 'src/invoices/**'
      - 'src/database/migrations/1788280800000-AddAgentCodCollection.ts'
      - '.github/workflows/stage3f-destination-receipt.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      B5B_TEST_DB_HOST: localhost
      B5B_TEST_DB_PORT: 5432
      B5B_TEST_DB_PASSWORD: stage3f_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Create isolated PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kentexa_b5b_test_user LOGIN PASSWORD 'stage3f_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE DATABASE kentexa_b5b_test OWNER kentexa_b5b_test_user;
          SQL
      - run: npm test -- --runInBand super-agents/super-agents.destination-receipt.real-postgres.spec.ts
      - run: npm test -- --runInBand transport/transport.hub-arrival.spec.ts
      - run: npm test -- --runInBand transport/transport.carrier-collection.spec.ts
      - run: npm test -- --runInBand transport/webhook.delivery-boundary.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.destination-receipt.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.buyer-choice.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.buyer-choice.real-postgres.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.recipient-pickup.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.recipient-pickup.real-postgres.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.cod-pickup.real-postgres.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.cod-release-boundary.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.agent-handoff.real-postgres.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.agent-delivery.real-postgres.spec.ts
      - run: npm test -- --runInBand super-agents/super-agents.agent-cod.real-postgres.spec.ts
      - run: npm test -- --runInBand money-routing/order-release-handover.real-postgres.spec.ts
      - run: npm test -- --runInBand orders/orders.custody-sync.spec.ts
      - run: npm test -- --runInBand orders/orders.custody-completion.real-postgres.spec.ts
      - run: npm test -- --runInBand agent-orders/agent-orders.delivery-boundary.real-postgres.spec.ts
      - run: npx tsc --noEmit --project tsconfig.build.json
