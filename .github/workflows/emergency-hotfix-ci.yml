name: Emergency Hotfix CI

on:
  push:
    branches:
      - hotfix/admin-account-verification-override
  pull_request:
    branches:
      - worktree-service-provider-profiles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend focused tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused admin verification tests
        run: npm test -- --runInBand users/users.controller.spec.ts users/users.service.spec.ts

      - name: Backend build
        run: npm run build

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bishoo-frontend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bishoo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mobile install and service worker safety tests
        run: CI=true npm test -- --watch=false --runInBand src/public/hooks/usePWA.test.js src/serviceWorkerPolicy.test.js

      - name: Frontend build
        run: npm run build
