name: Stage 3A1 Custody PostgreSQL Gate

on:
  pull_request:
    branches:
      - worktree-service-provider-profiles
    paths:
      - 'src/super-agents/entities/parcel-custody-event.entity.ts'
      - 'src/super-agents/super-agents.module.ts'
      - 'src/database/migrations/1788278400000-AddParcelCustodyEvent.ts'
      - 'src/database/migrations/add-parcel-custody-event*.spec.ts'
      - '.github/workflows/stage3a1-custody-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: Isolated PostgreSQL 16 migration proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      B5B_TEST_DB_HOST: localhost
      B5B_TEST_DB_PORT: 5432
      B5B_TEST_DB_PASSWORD: stage3a1_ci_only

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated least-privileged PostgreSQL test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kentexa_b5b_test_user LOGIN PASSWORD 'stage3a1_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE DATABASE kentexa_b5b_test OWNER kentexa_b5b_test_user;
          SQL

      - name: Stage 3A1 real PostgreSQL proof
        run: npm test -- --runInBand database/migrations/add-parcel-custody-event.real-postgres.spec.ts

      - name: Stage 3A1 rollback unit test
        run: npm test -- --runInBand database/migrations/add-parcel-custody-event.spec.ts

      - name: TypeScript compile
        run: npx tsc --noEmit --project tsconfig.build.json
