name: Business Profile Onboarding Tests

on:
  push:
    branches:
      - feature/business-profile-onboarding

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bishoo-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bishoo-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: CI=true npm test -- --watch=false --runInBand
      - name: Build frontend
        if: always()
        run: npm run build
