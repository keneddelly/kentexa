<text x="800" y="1330" text-anchor="middle" class="muted" font-size="27">Intelligence recommends. Kentexa domain systems remain authoritative.</text>
<path d="M520 1390H1080" stroke="url(#amber)" stroke-width="5" stroke-linecap="round"/>
<text x="800" y="1460" text-anchor="middle" class="white" font-size="31" font-weight="700">KENTEXA  •  CONNECT  •  DISCOVER  •  TRADE</text>
