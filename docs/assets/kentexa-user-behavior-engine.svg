<g class="small white"><rect x="1175" y="590" width="325" height="66" rx="14" fill="#182b50"/><text x="1205" y="633">◇  Relevant products</text><rect x="1175" y="674" width="325" height="66" rx="14" fill="#182b50"/><text x="1205" y="717">◎  Related communities</text><rect x="1175" y="758" width="325" height="66" rx="14" fill="#182b50"/><text x="1205" y="801">↗  Reseller opportunities</text><rect x="1175" y="842" width="325" height="66" rx="14" fill="#182b50"/><text x="1205" y="885">✧  Personalized discovery</text><rect x="1175" y="926" width="325" height="66" rx="14" fill="#182b50"/><text x="1205" y="969">◷  Timely engagement</text></g></g>
