<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071326"/><stop offset="1" stop-color="#101d39"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#00d9ff"/><stop offset="1" stop-color="#315bff"/></linearGradient>
  <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#9b5cff"/><stop offset="1" stop-color="#3d6dff"/></linearGradient>
  <linearGradient id="amber" x2="1" y2="0"><stop stop-color="#ffb000"/><stop offset="1" stop-color="#ff6b22"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22cfff"/></marker>
  <style>
    .sans{font-family:Inter,Arial,sans-serif}.white{fill:#f7fbff}.muted{fill:#a9bad2}.cyan{fill:#29d8ff}.amber{fill:#ffb51b}
    .panel{fill:#0c1d38;stroke:#4c83ff;stroke-width:3}.small{font-size:27px}.medium{font-size:34px}.head{font-size:68px;font-weight:800;letter-spacing:-2px}
  </style>
</defs>
<rect width="1600" height="1600" fill="url(#bg)"/>
<g opacity=".16" stroke="#2775c9" fill="none"><path d="M0 250H1600M0 1300H1600M180 0V1600M1420 0V1600"/><path d="M0 420L1600 120M0 1180L1600 820M260 0L1200 1600"/></g>
