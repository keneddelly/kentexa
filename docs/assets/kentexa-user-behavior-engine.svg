<rect x="655" y="735" width="290" height="60" rx="14" fill="#172d50"/><text x="800" y="775" text-anchor="middle" class="white small">Behavior aggregation</text>
<rect x="655" y="812" width="290" height="60" rx="14" fill="#172d50"/><text x="800" y="852" text-anchor="middle" class="white small">Intent understanding</text>
<rect x="655" y="889" width="290" height="60" rx="14" fill="#172d50"/><text x="800" y="929" text-anchor="middle" class="white small">Profile & ranking</text>
<text x="800" y="990" text-anchor="middle" class="amber" font-size="22" font-weight="700">EVIDENCE • CONFIDENCE • CONTEXT</text></g>
