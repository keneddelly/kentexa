<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Kentexa app icon master source.
    Full-bleed background so OS-level icon masks (circle/squircle/rounded
    square on Android, rounded square on iOS) can crop it themselves without
    a double-inset look — matches the same two-tone fox-head mark used in
    Navbar.js/HomeFeed.js/Welcome.js's badges, scaled up and centered.

    This is the SOURCE for native app icons/splash screens, not a drop-in
    manifest icon by itself: PWA/Capacitor tooling (e.g. `npx capacitor-assets
    generate`) rasterizes this one file into every required PNG size for
    Android/iOS/the web manifest. No PNG rasterization tool was available in
    this environment to produce those sizes directly.
  -->
  <rect width="512" height="512" fill="#1d4ed8"/>
  <g transform="translate(256,256) scale(15) translate(-11,-11)">
    <path d="M2 2 L7 8 L11 5 L11 20 L5 14 Z" fill="#ffffff"/>
    <path d="M20 2 L15 8 L11 5 L11 20 L17 14 Z" fill="#60a5fa"/>
    <circle cx="7.5" cy="9.5" r="1" fill="#0f172a"/>
    <circle cx="14.5" cy="9.5" r="1" fill="#0f172a"/>
  </g>
</svg>
