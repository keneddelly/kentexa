<!DOCTYPE html>
<html lang="sw-TZ">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- ✅ PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KenteXa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="KenteXa" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192x192.png" />

    <!-- ✅ Primary SEO -->
    <title>Kentexa — Free POS & Business Tools in Tanzania</title>
    <meta name="description" content="Kentexa is a free-to-use business platform in Tanzania. Explore POS tools, record shop sales, improve stock visibility and connect your business with customers." />
    <meta name="keywords" content="KenteXa, Bishoo Tanzania, Tanzania marketplace, online shopping Tanzania, buy sell Tanzania, M-Pesa shopping, classified ads Tanzania, Dar es Salaam market, Tanzania e-commerce" />
    <meta name="author" content="Bishoo Intelligence Systems (BiS)" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kentexa.com" />

    <!-- ✅ Open Graph (Facebook, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kentexa.com" />
    <meta property="og:title" content="Kentexa — Free POS & Business Tools in Tanzania" />
    <meta property="og:description" content="Explore Kentexa's free-to-use business tools, POS capabilities and marketplace for businesses and customers in Tanzania." />
    <meta property="og:image" content="https://kentexa.com/og-image.png" />
    <meta property="og:locale" content="en_TZ" />
    <meta property="og:site_name" content="KenteXa" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KenteXa — Tanzania's #1 Marketplace" />
    <meta name="twitter:description" content="Buy, sell and pay securely anywhere in Tanzania. Formerly Bishoo Tanzania." />
    <meta name="twitter:image" content="https://kentexa.com/og-image.png" />

    <!-- ✅ Structured Data (Google understands this) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KenteXa",
      "alternateName": ["Bishoo Tanzania", "Bishoo Intelligence Systems"],
      "url": "https://kentexa.com",
      "logo": "https://kentexa.com/logo.png",
      "description": "Kentexa is a free-to-use business platform in Tanzania, helping businesses explore POS tools, record sales, improve stock visibility and connect with customers.",
      "foundingDate": "2024",
      "founder": {
        "@type": "Person",
        "name": "Kened Delly"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@kentexa.com",
        "contactType": "Customer Support",
        "availableLanguage": ["English", "Swahili"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "TZ",
        "addressLocality": "Tanzania"
      },
      "sameAs": [
        "https://kentexa.com"
      ]
    }
    </script>

    <!-- ✅ Marketplace structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kentexa",
      "url": "https://kentexa.com",
      "description": "Free-to-use business tools, POS capabilities and marketplace in Tanzania",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kentexa.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run KenteXa Marketplace.</noscript>
    <div id="root"></div>
  </body>
</html>
