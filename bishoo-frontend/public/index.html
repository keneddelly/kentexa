<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SVG favicon first — modern browsers prefer it and it's crisp at any
         size; favicon.ico stays as the legacy fallback for browsers that
         don't support rel="icon" type="image/svg+xml". -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icon-source.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- ✅ PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kentexa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kentexa" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- ✅ Primary SEO -->
    <title>Kentexa — Commerce, Services & Opportunities</title>
    <meta name="description" content="Kentexa connects people and businesses across Tanzania to discover products, offer services, post Classifieds, share Moments and grow their business — all in one platform." />
    <meta name="keywords" content="Kentexa, Tanzania commerce, digital business identity, online business Tanzania, Classifieds Tanzania, business services Tanzania, M-Pesa payments, Super Agent delivery" />
    <meta name="author" content="Bishoo Intelligence Systems (BiS)" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kentexa.com" />

    <!-- ✅ Open Graph (Facebook, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kentexa.com" />
    <meta property="og:title" content="Kentexa — Commerce, Services & Opportunities" />
    <meta property="og:description" content="Kentexa connects people and businesses across Tanzania to discover products, offer services, post Classifieds, share Moments and grow their business — all in one platform." />
    <meta property="og:image" content="https://kentexa.com/og-image.png" />
    <meta property="og:locale" content="en_TZ" />
    <meta property="og:site_name" content="Kentexa" />

    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kentexa — Commerce, Services & Opportunities" />
    <meta name="twitter:description" content="Kentexa connects people and businesses across Tanzania to discover products, offer services, post Classifieds, share Moments and grow their business — all in one platform." />
    <meta name="twitter:image" content="https://kentexa.com/og-image.png" />

    <!-- ✅ Structured Data (Google understands this) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kentexa",
      "alternateName": ["KenteXa", "Bishoo Tanzania", "Bishoo Intelligence Systems"],
      "url": "https://kentexa.com",
      "logo": "https://kentexa.com/logo.png",
      "description": "Kentexa is a digital business identity and commerce network connecting people and businesses through products, services, Classifieds and Moments — with M-Pesa payments and nationwide delivery in Tanzania.",
      "foundingDate": "2024",
      "founder": {
        "@type": "Person",
        "name": "Kened Delly"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@kentexa.com",
        "contactType": "Customer Support",
        "availableLanguage": ["English", "Swahili"]
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "TZ",
        "addressLocality": "Tanzania"
      },
      "sameAs": [
        "https://kentexa.com"
      ]
    }
    </script>

    <!-- ✅ WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kentexa",
      "url": "https://kentexa.com",
      "description": "Kentexa — Tanzania's digital business identity and commerce network",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://kentexa.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Kentexa.</noscript>
    <div id="root"></div>
  </body>
</html>
