# Render Blueprint for Kentexa: the main backend + the Early Access Portal,
# plus a managed Postgres database for the backend.
#
# Payment providers (ClickPesa, Selcom) are intentionally left unconfigured —
# their services fall back to placeholder values and never crash the app,
# they just fail if a payment is actually attempted. SMS (Africa's Talking)
# is required: the backend crashes on boot if AT_API_KEY is empty.
#
# To deploy: in the Render dashboard, "New" -> "Blueprint", point it at this
# repo/branch. Render provisions the database and both services below. Then
# fill in every envVar marked `sync: false` (real secrets — never commit
# these) in each service's Environment tab.
databases:
  - name: kentexa-db
    plan: free # Render free Postgres is deleted after 90 days of inactivity-free lifetime unless upgraded — fine for a time-boxed early-access period, revisit before then
    databaseName: kentexa
    user: kentexa

services:
  - type: web
    name: bishoo-backend
    runtime: node
    plan: starter # paid — always-on, no free-tier spin-down/cold-start on the OTP + registration API
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies by default, but @nestjs/cli (the `nest` build command)
    # lives there and is only needed at build time, not at runtime.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # required — the app refuses to start without this
      - key: AT_API_KEY
        sync: false # required — Africa's Talking API key, or boot crashes
      - key: AT_USERNAME
        sync: false # Africa's Talking account username (not "sandbox" once using a real key)
      - key: AT_SHORTCODE
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # required — image uploads crash without this (src/upload/upload.controller.ts). Use a ROTATED key, not the one that was previously hardcoded/leaked in this file.
      - key: CLOUDINARY_API_KEY
        sync: false # required — see above
      - key: CLOUDINARY_API_SECRET
        sync: false # required — see above
      - key: ANTHROPIC_API_KEY
        sync: false # optional — Kentexa AI "coding" tier + fallback-of-last-resort; safe to leave unset for now
      - key: OPENAI_API_KEY
        sync: false # optional — Kentexa AI "reasoning" tier. Unset means that tier falls back to whichever provider IS configured.
      - key: DEEPSEEK_API_KEY
        sync: false # optional — Kentexa AI "simple" tier (moderation, search, drafts, listings) — cheapest, recommended default
      - key: QWEN_API_KEY
        sync: false # optional — additional cheap-tier provider / fallback
      - key: AI_SIMPLE_PROVIDER
        value: deepseek # which provider handles simple tasks (moderation/search-parse/reply-draft/product-listing/summary)
      - key: AI_SIMPLE_MODEL
        value: deepseek-chat
      - key: AI_REASONING_PROVIDER
        value: openai
      - key: AI_REASONING_MODEL
        value: gpt-4o
      - key: AI_CODING_PROVIDER
        value: anthropic
      - key: AI_CODING_MODEL
        value: claude-opus-5
      - key: AI_SIMPLE_FALLBACK_PROVIDER
        value: qwen # optional per-tier fallback; falls back to any configured provider if unset
      - key: AI_REQUEST_TIMEOUT_MS
        value: "15000"
      - key: DB_HOST
        fromDatabase:
          name: kentexa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kentexa-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: kentexa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kentexa-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: kentexa-db
          property: database

  - type: web
    name: kentexa-early-access
    runtime: node
    plan: starter # paid — always-on, no free-tier spin-down/cold-start on the landing page itself
    rootDir: kentexa-early-access
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        sync: false # set to the bishoo-backend service's URL once it's deployed (see above)
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false # optional — your Meta (Facebook/Instagram) Pixel ID from Events Manager; leave unset to disable Pixel tracking entirely
